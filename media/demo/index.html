<!doctype html><html><head><meta charset="utf-8"><title>ToolPilot Lab — Demo UI</title><style>
*{box-sizing:border-box}body{margin:0;background:#0b0f14;color:#f3f6f8;font-family:-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif;font-size:19px}.shell{display:flex;height:1080px}.side{width:290px;background:#101821;border-right:1px solid #253443;padding:34px 24px}.brand{font-size:24px;font-weight:900;letter-spacing:1.2px;color:#b6f84a;margin-bottom:12px}.sub{color:#8fa2b5;font-size:14px;letter-spacing:2px;margin-bottom:55px}.nav{padding:16px 18px;border-radius:12px;margin:7px 0;color:#a7b7c5}.nav.on{background:#23382b;color:#c9ff77;font-weight:700}.main{flex:1;padding:34px 46px}.top{display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #293947;padding-bottom:24px}.tag{font-size:14px;letter-spacing:2px;color:#9cb0bf}.demo{font-size:13px;letter-spacing:2px;border:1px solid #5f6f7b;color:#acbcc9;border-radius:20px;padding:10px 18px}.title{font-size:42px;font-weight:800;margin:38px 0 10px}.desc{color:#9aafbf;margin-bottom:30px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:20px}.card{background:#15202b;border:1px solid #2b3e4d;border-radius:20px;padding:25px}.label{font-size:14px;color:#9cb1c2;letter-spacing:1.3px;text-transform:uppercase}.value{font-size:62px;font-weight:800;margin:15px 0 6px}.unit{font-size:18px;color:#a9bac7}.good{color:#b6f84a}.bad{color:#ff7d71}.blue{color:#83d5ff}.panel{background:#131e29;border:1px solid #314656;border-radius:22px;padding:28px;margin-top:22px}.paneltitle{font-size:19px;font-weight:800;margin-bottom:22px}.timeline{height:200px;display:flex;align-items:end;gap:6px;border-bottom:1px solid #4e6474;padding:0 6px 8px}.bar{flex:1;border-radius:5px 5px 0 0;background:linear-gradient(#c4fa78,#4e9c69)}.bar.hot{background:linear-gradient(#ffb07a,#d85252)}.row{display:flex;gap:18px;align-items:center;padding:18px 0;border-top:1px solid #2b3d4c}.pill{background:#24384a;border-radius:9px;padding:8px 11px;font-size:15px;color:#aadcf3}.code{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:22px;line-height:1.7;white-space:pre;color:#d5e5f1}.key{color:#83d5ff}.str{color:#c3f48b}.num{color:#ffb078}.muted{color:#819aaa}.status{display:inline-block;background:#264a35;color:#b6f84a;border-radius:20px;padding:10px 18px;font-size:17px;font-weight:700}.chart{position:relative;height:300px;margin-top:20px;border-left:1px solid #455e6e;border-bottom:1px solid #455e6e}.line{position:absolute;left:15px;right:15px;top:120px;height:5px;background:linear-gradient(90deg,#78c6ff,#b6f84a);transform:skewY(-10deg);border-radius:8px}.dot{position:absolute;background:#b6f84a;width:20px;height:20px;border-radius:50%}.flow{display:flex;align-items:center;gap:18px;margin:70px 0}.flowbox{flex:1;padding:35px 25px;background:#1b2b37;border:1px solid #506477;border-radius:18px;text-align:center;font-weight:750;font-size:24px}.arrow{font-size:40px;color:#b6f84a}.foot{position:absolute;bottom:25px;color:#6f8596;font-size:13px;letter-spacing:1px}
</style></head><body><div class="shell"><aside class="side"><div class="brand">↗ TOOLPILOT</div><div class="sub">AI SYSTEMS LAB</div><div id="nav"></div><div class="foot">LOCAL DEMO · ILLUSTRATIVE DATA</div></aside><main class="main"><div class="top"><div class="tag">PROJECT / PROMPT PIPELINE / RUN 0042</div><div class="demo">DEMO UI · SAMPLE METRICS</div></div><div id="content"></div></main></div><script>
const tabs=['Overview','Network trace','Token budget','Response JSON','Retrieval','Rate limits'];const n=Number(new URLSearchParams(location.search).get('screen')||0);document.getElementById('nav').innerHTML=tabs.map((t,i)=>`<div class="nav ${i===n?'on':''}">${t}</div>`).join('');const c=document.getElementById('content');const bars=[26,31,27,37,34,51,45,57,39,66,47,72,55,77,63,82,70,89,75,94,85,73,62,57,48,42,37,33,29,24];
const card=(label,value,unit,color='good')=>`<div class="card"><div class="label">${label}</div><div class="value ${color}">${value}</div><div class="unit">${unit}</div></div>`;
if(n===0)c.innerHTML=`<div class="title">Run overview</div><div class="desc">Request timing, token usage and completion status.</div><div class="grid">${card('Time to first token','0.84','seconds','bad')}${card('Total response','3.26','seconds','blue')}${card('Task success','✓','sample check passed')}</div><div class="panel"><div class="paneltitle">Latency over recent requests</div><div class="timeline">${bars.map((b,i)=>`<div class="bar ${i>15&&i<21?'hot':''}" style="height:${b}%"></div>`).join('')}</div><div class="row"><span class="pill">P95 latency</span><strong>4.8 seconds</strong><span class="muted">·</span><span>Investigate slow requests before shipping.</span></div></div>`;
if(n===1)c.innerHTML=`<div class="title">Network trace</div><div class="desc">Inspect the request timeline rather than judging the animation.</div><div class="panel"><div class="paneltitle">POST /v1/responses <span class="status" style="float:right">200 OK</span></div><div class="row"><span class="pill">DNS</span><div style="width:90px;height:22px;background:#7dbde8;border-radius:6px"></div><strong>38 ms</strong></div><div class="row"><span class="pill">TLS</span><div style="width:160px;height:22px;background:#7dbde8;border-radius:6px"></div><strong>92 ms</strong></div><div class="row"><span class="pill">First token</span><div style="width:530px;height:22px;background:#ff8d73;border-radius:6px"></div><strong>840 ms</strong></div><div class="row"><span class="pill">Stream</span><div style="width:700px;height:22px;background:#b6f84a;border-radius:6px"></div><strong>2.42 s</strong></div></div><div class="grid" style="margin-top:22px">${card('Request','0042','trace ID','blue')}${card('TTFT','0.84','seconds','bad')}${card('Total','3.26','seconds')}</div>`;
if(n===2)c.innerHTML=`<div class="title">Token budget</div><div class="desc">Track context before the next tool call.</div><div class="grid">${card('Input tokens','3,240','of 8,000 available','blue')}${card('Output tokens','680','generated')}${card('Remaining','4,080','tokens in budget')}</div><div class="panel"><div class="paneltitle">Context usage</div><div style="height:90px;background:#263643;border-radius:16px;overflow:hidden;display:flex"><div style="width:40%;background:#83d5ff"></div><div style="width:9%;background:#b6f84a"></div><div style="width:51%;background:#334854"></div></div><div class="row"><span class="pill">40% input</span><span class="pill">9% output</span><span class="pill">51% available</span></div></div>`;
if(n===3)c.innerHTML=`<div class="title">Response JSON</div><div class="desc">Validate structured output and retry failed tool calls safely.</div><div class="panel"><div class="paneltitle">response.json <span class="status" style="float:right">VALID</span></div><div class="code">{
  <span class="key">"request_id"</span>: <span class="str">"run_0042"</span>,
  <span class="key">"status"</span>: <span class="str">"complete"</span>,
  <span class="key">"latency_ms"</span>: <span class="num">3260</span>,
  <span class="key">"tool_calls"</span>: [
    { <span class="key">"name"</span>: <span class="str">"search_docs"</span>, <span class="key">"retry"</span>: <span class="num">0</span> }
  ],
  <span class="key">"validated"</span>: <span class="str">true</span>
}</div></div>`;
if(n===4)c.innerHTML=`<div class="title">Retrieval pipeline</div><div class="desc">Embeddings point to documents. The source still needs review.</div><div class="flow"><div class="flowbox">User question</div><div class="arrow">→</div><div class="flowbox">Vector search</div><div class="arrow">→</div><div class="flowbox">Source excerpt</div><div class="arrow">→</div><div class="flowbox">Answer</div></div><div class="panel"><div class="paneltitle">Top match <span class="status" style="float:right">SOURCE REVIEW</span></div><div class="row"><span class="pill">docs/architecture.md</span><strong>Similarity: 0.87</strong></div><div class="row"><span class="muted">Retrieved passage:</span><span>“Validate sources and cite the original document.”</span></div></div>`;
if(n===5)c.innerHTML=`<div class="title">Rate limits & task success</div><div class="desc">A prototype becomes useful when users finish their work.</div><div class="grid">${card('Requests left','742','of 1,000 per hour')}${card('Retry rate','0.8%','last 24 hours','blue')}${card('Task success','91%','sample evaluation')}</div><div class="panel"><div class="paneltitle">Release checklist</div><div class="row"><span class="status">✓</span><span>Response schema validated</span></div><div class="row"><span class="status">✓</span><span>Rate limit alerts configured</span></div><div class="row"><span class="status">✓</span><span>User task completion measured</span></div></div>`;
</script></body></html>
